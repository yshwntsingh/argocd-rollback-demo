apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demoapp
  labels:
    app: my-app
spec:
  replicas: 3
  # progressDeadlineSeconds is how long ArgoCD/K8s waits before it marks the
  # rollout as failed. Kept short so a bad deploy surfaces quickly in the demo.
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # never drop below desired replicas -> zero downtime
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: web
        image: nginx:1.25   # <-- rewritten by .github/workflows/deploy-on-tag.yml
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
